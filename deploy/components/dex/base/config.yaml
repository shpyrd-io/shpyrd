apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
data:
  config.yaml: |
    issuer: ${SHPYRD_AUTH_URL}
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    telemetry:
      http: 0.0.0.0:5558
    # The pages Dex still serves (errors, connector chooser, password
    # fallback) are shpyrd's, laid over the image's by the web init
    # container (RFC-0012, design/pages). home is where a failed sign-in
    # starts again: the dashboard, never an address the request names.
    frontend:
      dir: /web
      issuer: shpyrd
      theme: shpyrd
      logoURL: theme/logo.svg
      extra:
        home: ${SHPYRD_DASHBOARD_URL}
    oauth2:
      skipApprovalScreen: true
      responseTypes: [code]
    expiry:
      idTokens: 24h
      refreshTokens:
        validIfNotUsedFor: 168h
        absoluteLifetime: 720h
    # Optional OSS credentials are managed by the operator in this file.
    # Keep each userID stable; never recycle it for another person.
    staticPasswords: []
    enablePasswordDB: true
    # The platform's client is an OAuth2Client resource the server keeps
    # (RFC-0080): its redirect URIs are the console's and every workspace's
    # callback. Nothing static here.
