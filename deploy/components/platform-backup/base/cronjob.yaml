# The platform's state, exported by the server binary and encrypted with the
# passphrase in Secret shpyrd-backup-key (print it with `shpyrd cluster
# backup key` and keep it somewhere else: without it a backup is noise), to
# the target in Secret platform-backup-target (hook backup-target, from
# --backup-target and its credentials). `shpyrd cluster backup` runs the
# same job now.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-backup
spec:
  schedule: "${SHPYRD_BACKUP_SCHEDULE}"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: platform-backup
            app.kubernetes.io/part-of: shpyrd
            shpyrd.io/control-plane-client: "true"
        spec:
          serviceAccountName: shpyrd-server
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ${SHPYRD_SERVER_IMAGE}
              args: ["backup"]
              env:
                - name: SHPYRD_SYSTEM_NAMESPACE
                  value: shpyrd-system
                # The archives are fetched on the server's sources port: the
                # only one its NetworkPolicy opens to the platform's own pods
                # (the API port is for the front doors). Port 80 timed out,
                # and no backup ever completed.
                - name: SHPYRD_INTERNAL_URL
                  value: http://shpyrd-server.shpyrd-system.svc:8082
                - name: SHPYRD_BACKUP_KEEP
                  value: "${SHPYRD_BACKUP_KEEP}"
                - name: SHPYRD_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: control-plane-db
                      key: url
                - name: SHPYRD_BACKUP_PASSPHRASE
                  valueFrom:
                    secretKeyRef:
                      name: shpyrd-backup-key
                      key: passphrase
              envFrom:
                - secretRef:
                    name: platform-backup-target
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              # The archive is written to this scratch disk and uploaded
              # from there, never held in memory as a whole: at 512Mi the
              # production job was killed at its limit on every run (#119).
              # The limit is SHPYRD_BACKUP_MEMORY for the platforms whose
              # archives outgrow the default.
              volumeMounts:
                - name: scratch
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: ${SHPYRD_BACKUP_MEMORY}
          volumes:
            - name: scratch
              emptyDir:
                sizeLimit: 4Gi
