apiVersion: v1
kind: ServiceAccount
metadata:
  name: object-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: object-storage
spec:
  selector:
    app.kubernetes.io/name: object-storage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: admin
      port: 3903
      targetPort: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-storage
spec:
  # Two replicas, or the one of a single writer (SHPYRD_GATEWAY_SINGLE_WRITER
  # on a provider that ignores If-Match, see the oci profile).
  replicas: ${SHPYRD_GATEWAY_REPLICAS}
  selector:
    matchLabels:
      app.kubernetes.io/name: object-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-storage
        app.kubernetes.io/part-of: shpyrd
    spec:
      serviceAccountName: object-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ${SHPYRD_SERVER_IMAGE}
          args: [object-gateway]
          envFrom:
            - secretRef:
                name: object-gateway-backend
          env:
            - name: SHPYRD_GATEWAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: object-storage-admin
                  key: adminToken
            - name: SHPYRD_GATEWAY_SINGLE_WRITER
              value: "${SHPYRD_GATEWAY_SINGLE_WRITER}"
            - name: GOMEMLIMIT
              value: 400MiB
          ports:
            - name: s3
              containerPort: 3900
            - name: admin
              containerPort: 3903
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
          livenessProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
# A node drain or an autoscaler eviction takes one gateway pod at a time:
# with two replicas one keeps serving the S3 consumers (registry, sources,
# backups); with the single replica of a single writer the drain is not
# blocked and the pod comes back on another node.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: object-storage
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: object-storage
---
# Only the control plane can call the administrative listener. Project
# workloads can reach S3 and still require a scoped signed credential.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: object-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: object-storage
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 3900
    - from:
        - podSelector: {}
      ports:
        - port: 3903
