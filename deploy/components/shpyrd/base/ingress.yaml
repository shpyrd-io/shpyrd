apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shpyrd-tls
spec:
  secretName: shpyrd-tls
  dnsNames:
    - ${SHPYRD_CONSOLE_HOST}
  issuerRef:
    kind: ClusterIssuer
    name: ${SHPYRD_PLATFORM_ISSUER}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shpyrd-server
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Build logs, `shpyrd logs -f` and the web terminal are long-lived
    # responses that can stay silent for minutes; nginx's default (60s)
    # would cut them.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: ${SHPYRD_PLATFORM_INGRESS_CLASS}
  tls:
    - hosts:
        - ${SHPYRD_CONSOLE_HOST}
      secretName: shpyrd-tls
  rules:
    - host: ${SHPYRD_CONSOLE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shpyrd-server
                port:
                  name: http
