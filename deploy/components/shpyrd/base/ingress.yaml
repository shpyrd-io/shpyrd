apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shpyrd-tls
spec:
  secretName: shpyrd-tls
  dnsNames:
    - ${SHPYRD_CONSOLE_HOST}
  issuerRef:
    kind: ClusterIssuer
    name: ${SHPYRD_PLATFORM_ISSUER}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shpyrd-server
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Build logs, `shpyrd logs -f` and the web terminal are long-lived
    # responses that can stay silent for minutes; nginx's default (60s)
    # would cut them.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Request bodies stay at nginx's 1 MiB default: this is a JSON API and
    # nginx buffers a body before the server sees it. The one upload, the
    # source archive of `shpyrd deploy`, has its own Ingress below.
spec:
  ingressClassName: ${SHPYRD_PLATFORM_INGRESS_CLASS}
  tls:
    - hosts:
        - ${SHPYRD_CONSOLE_HOST}
      secretName: shpyrd-tls
  rules:
    - host: ${SHPYRD_CONSOLE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shpyrd-server
                port:
                  name: http
---
# POST /api/sources takes the source archive `shpyrd deploy` uploads (and
# `shpyrd cluster restore` its archives): up to 512 MiB, pkg/api/sources.go
# maxSourceSize. ingress-nginx folds this Ingress into the same server as
# the one above as a second location, so the larger body applies to that
# path alone, streamed (not buffered) so the server can refuse an
# unauthenticated upload before reading it. Workspace front doors get the
# same companion from the controller (internal/controller, ensureSourcesFrontDoor).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shpyrd-server-sources
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: ${SHPYRD_PLATFORM_INGRESS_CLASS}
  tls:
    - hosts:
        - ${SHPYRD_CONSOLE_HOST}
      secretName: shpyrd-tls
  rules:
    - host: ${SHPYRD_CONSOLE_HOST}
      http:
        paths:
          - path: /api/sources
            pathType: Exact
            backend:
              service:
                name: shpyrd-server
                port:
                  name: http
---
# Project archives stream directly in both directions. The API separately
# limits expanded bytes and authenticates before consuming an upload.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shpyrd-server-archives
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "65g"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: ${SHPYRD_PLATFORM_INGRESS_CLASS}
  tls:
    - hosts:
        - ${SHPYRD_CONSOLE_HOST}
      secretName: shpyrd-tls
  rules:
    - host: ${SHPYRD_CONSOLE_HOST}
      http:
        paths:
          - path: /api/project-archives
            pathType: Prefix
            backend:
              service:
                name: shpyrd-server
                port:
                  name: http
          - path: /api/cluster/project-archives
            pathType: Prefix
            backend:
              service:
                name: shpyrd-server
                port:
                  name: http
---
# Internal names (#311): a project calls another of its workspace at
# http://<project>.internal. The name resolves to the internal front door
# (CoreDNS, the internal-names-dns hook), where this Ingress catches every
# bare name and hands it to the server, which knows the caller's workspace
# from the address the call came from and forwards the request to the
# qualified name, <project>.<workspace>.internal, served by the project's
# own Ingress on the same controller. Plain HTTP: nothing here leaves the
# cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shpyrd-server-internal-names
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: ${SHPYRD_INTERNAL_NAMES_INGRESS_CLASS}
  rules:
    - host: "*.internal"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shpyrd-server
                port:
                  name: http
