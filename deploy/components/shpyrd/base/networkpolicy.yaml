# Who may reach the platform's server (RFC-0033). The API, the dashboard,
# the edge's authorisation endpoint and the error pages are for the front
# doors: the ingress controllers, and callers that are not pods (the API
# server for its proxy and the admission webhook, the nodes for probes). A
# project's pods reach only the sources port, where builds fetch their
# archives. Prometheus reads the metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shpyrd-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shpyrd-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx-internal
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["${SHPYRD_POD_CIDR}"]
      ports:
        - port: 8080
        - port: 9443
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: shpyrd.io/project
                operator: Exists
        # The platform's own jobs (the backup exports the archives).
        - podSelector: {}
      ports:
        - port: 8082
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8081
    # Both selectors in each peer must match. No project can opt itself
    # into access by setting a pod label in its own namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${SHPYRD_INTERNAL_API_ACCOUNTS_NAMESPACE}"
          podSelector:
            matchLabels:
              shpyrd.io/app: "${SHPYRD_INTERNAL_API_ACCOUNTS_APP}"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${SHPYRD_INTERNAL_API_BILLING_NAMESPACE}"
          podSelector:
            matchLabels:
              shpyrd.io/app: "${SHPYRD_INTERNAL_API_BILLING_APP}"
      ports:
        - port: 8083
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8084
