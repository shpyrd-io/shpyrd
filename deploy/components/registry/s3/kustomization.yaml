# S3 storage for any profile with SHPYRD_REGISTRY_BUCKET configured.
# Without a bucket the installer uses the filesystem base.
# Requires SHPYRD_REGISTRY_BUCKET, SHPYRD_REGISTRY_ENDPOINT, SHPYRD_REGISTRY_REGION.
# Credentials come from the registry-s3 Secret (registry-s3 hook).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shpyrd-system
resources:
  - ../base
  - pdb.yaml
patches:
  # On object storage the registry is stateless: two replicas, rolled one
  # at a time, so a platform roll or a node drain never stops image pulls
  # (storage plan step 7). The filesystem base keeps one with Recreate: its
  # claim is read-write-once.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: registry
      spec:
        replicas: 2
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: registry-data
      $patch: delete
  - target:
      kind: ConfigMap
      name: registry-config
    path: s3-config-patch.yaml
  - target:
      kind: Deployment
      name: registry
    path: s3-deployment-patch.yaml
