apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      formatter: text
    storage:
      s3:
        regionendpoint: ${SHPYRD_REGISTRY_ENDPOINT}
        region: ${SHPYRD_REGISTRY_REGION}
        bucket: ${SHPYRD_REGISTRY_BUCKET}
        secure: ${SHPYRD_REGISTRY_S3_SECURE}
        v4auth: true
        forcepathstyle: true
      redirect:
        disable: true
      delete:
        enabled: true
      cache:
        blobdescriptor: inmemory
      maintenance:
        uploadpurging:
          enabled: true
          age: 168h
          interval: 24h
          dryrun: false
        readonly:
          enabled: false
    auth:
      htpasswd:
        realm: shpyrd
        path: /etc/registry/auth/htpasswd
    http:
      addr: :5000
      tls:
        certificate: /etc/registry/tls/tls.crt
        key: /etc/registry/tls/tls.key
      debug:
        addr: :5001
        prometheus:
          enabled: true
          path: /metrics
      headers:
        X-Content-Type-Options: [nosniff]
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
