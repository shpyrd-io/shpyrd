# The trust pod removes the node's registry-trust taint once the CA is in
# place (see the DaemonSet): that needs get and patch on nodes, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-nodes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shpyrd-registry-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shpyrd-registry-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shpyrd-registry-nodes
subjects:
  - kind: ServiceAccount
    name: registry-nodes
    namespace: shpyrd-system
