# ExternalDNS (RFC-0061). It owns the records it creates (TXT registry keyed
# by the cluster name) and never touches others in the zone. The provider
# and its credential come from the profile overlay.
provider:
  name: ${SHPYRD_DNS_PROVIDER}
sources: [service, ingress]
policy: sync
registry: txt
txtOwnerId: shpyrd-${SHPYRD_CLUSTER}
domainFilters: ${SHPYRD_DNS_DOMAINS}
extraArgs:
  # The ownership record of a wildcard cannot be named "a-*": use a label.
  txt-wildcard-replacement: wildcard
  # Hosts a published wildcard already answers for (the apps of the shared
  # apps domain, RFC-0033 names) carry this annotation: one record per
  # domain instead of one per app. Objects without it are unaffected.
  annotation-filter: "external-dns.alpha.kubernetes.io/exclude notin (true)"
serviceAccount:
  create: true
  name: external-dns
resources:
  requests:
    cpu: 10m
    memory: 32Mi
