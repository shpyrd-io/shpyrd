# Vector configuration for shpyrd (RFC-0022a).
#
# Pipeline: kubernetes_logs source -> remap (filter, label, parse JSON) ->
# shpyrd_enrich transform -> drain sinks (added by the controller from
# LogDrain objects, RFC-0023), plus the console sink of console.yaml on a
# local cluster.
#
# Hot path for drain sinks: the controller writes a ConfigMap
# vector-drains in logs-system and Vector reloads it via inotify.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector
data:
  vector.yaml: |
    # Topology
    data_dir: /var/lib/vector

    api:
      enabled: true
      address: 0.0.0.0:8686

    sources:
      # Delivery counters per drain sink, scraped by the LogDrain
      # controller for status (RFC-0023).
      internal_metrics:
        type: internal_metrics
      kubernetes_logs:
        type: kubernetes_logs
        # Read the shpyrd.io/* annotations Vector enriches from the API.
        pod_annotation_fields:
          pod_annotations: "kubernetes.pod_annotations"
        extra_label_selector: "app.kubernetes.io/managed-by=shpyrd"
        # Only collect from project namespaces (app-<slug>); platform and
        # build namespaces stay on the Kubernetes API stream.
        extra_namespace_label_selector: "shpyrd.io/project"

    transforms:
      shpyrd_enrich_raw:
        type: remap
        inputs: [kubernetes_logs]
        source: |
          # Core shpyrd labels from the pod annotations and labels. A
          # missing label reads as null (get! cannot fail on a literal
          # path, so no ?? here: VRL refuses one on an infallible call).
          labels = object!(.kubernetes.pod_labels)
          # RFC-0076: prefer the human-readable slug label; fall back to the
          # shpyrd.io/app label (which equals the App's name = the short id).
          .project   = get!(labels, ["shpyrd.io/project"])
          if .project == null { .project = get!(labels, ["shpyrd.io/app"]) }
          .process   = get!(labels, ["shpyrd.io/process"])
          # The namespace tells projects of different workspaces apart
          # (RFC-0033): drains select on it, never on the project name alone.
          .namespace = .kubernetes.pod_namespace
          .workspace = get!(labels, ["shpyrd.io/workspace"])
          if .workspace == null { .workspace = "default" }
          .instance  = string(get!(object!(.kubernetes.pod_annotations), ["shpyrd.io/instance"])) ?? .process
          .pod       = .kubernetes.pod_name

          # Stream: stdout / stderr.
          if !exists(.stream) { .stream = "stdout" }

          # Drop the kubernetes blob from the final event; keep only what we need.
          del(.kubernetes)
          del(.source_type)
          del(.file)

          # Parse JSON log lines: promote level and msg/message so drains and
          # future storage can filter by level without re-parsing.
          if is_string(.message) {
            parsed, err = parse_json(.message)
            if err == null && is_object(parsed) {
              .level   = to_string(get(parsed, ["level"]) ?? get(parsed, ["severity"]) ?? "") ?? null
              .msg     = to_string(get(parsed, ["msg"])   ?? get(parsed, ["message"])  ?? .message) ?? .message
              .fields  = parsed
              del(.fields.level); del(.fields.severity)
              del(.fields.msg);   del(.fields.message)
            }
          }

          if !exists(.level) { .level = null }
          if !exists(.msg)   { .msg   = .message }

      # Only process instances: build pods and the pods of attached
      # resources (Postgres, Redis) carry no shpyrd.io/process label and
      # stay on the Kubernetes API stream. Drains read from here.
      shpyrd_enrich:
        type: filter
        inputs: [shpyrd_enrich_raw]
        condition: "exists(.process) && .process != null && .process != \"\""

    sinks:
      prometheus:
        type: prometheus_exporter
        inputs: [internal_metrics]
        address: 0.0.0.0:9598
  # A file of its own, so the cloud profiles can leave it out: the enriched
  # stream on the agent's own stdout, where `kubectl logs -n logs-system
  # daemonset/vector` shows the pipeline at work on a local cluster. In
  # production it would only double every project's lines into the node's
  # log store.
  console.yaml: |
    sinks:
      console:
        type: console
        inputs: [shpyrd_enrich]
        encoding:
          codec: json
---
# Placeholder the LogDrain controller overwrites (RFC-0023). Shipping it
# lets Vector start before the first drain exists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-drains
data:
  drains.yaml: |
    # Rendered by shpyrd from LogDrain objects (RFC-0023). Do not edit.
    transforms: {}
    sinks: {}
