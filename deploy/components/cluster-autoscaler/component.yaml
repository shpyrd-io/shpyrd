name: cluster-autoscaler
description: Kubernetes Cluster Autoscaler for OCI OKE — scales the worker node pool between SHPYRD_NODE_MIN_COUNT and SHPYRD_NODE_MAX_COUNT based on pending pods and idle nodes (RFC-0075)
namespace: kube-system
# Only installed when the node pool OCID is provided (Terraform output node_pool_id).
# On clusters without autoscaling set SHPYRD_NODE_POOL_ID="" or omit it.
requiredVar: SHPYRD_NODE_POOL_ID
hooks: [autoscaler-credentials]
kustomize:
  path: ""
wait:
  - deployment: kube-system/cluster-autoscaler
timeout: 5m
