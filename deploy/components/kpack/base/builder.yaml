# Builder configuration for shpyrd apps.
#
# Each Paketo composite buildpack is registered as its own ClusterBuildpack.
# The buildpackages are multi-arch (amd64 + arm64) so kpack resolves the
# digest matching the node architecture, which matters on Apple Silicon. The
# prebuilt paketobuildpacks/builder-* images are amd64-only and must not be
# used as a buildpack source on arm64 clusters.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kpack-builder
  namespace: ${SHPYRD_SYSTEM_NS}
  labels:
    app.kubernetes.io/part-of: shpyrd
---
apiVersion: kpack.io/v1alpha2
kind: ClusterStack
metadata:
  name: jammy
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  id: io.buildpacks.stacks.jammy
  buildImage:
    image: index.docker.io/paketobuildpacks/build-jammy-base:latest
  runImage:
    image: index.docker.io/paketobuildpacks/run-jammy-base:latest
---
# The full stack (RFC-0065): more system libraries in the run image, for
# projects that ask for it with build.stack: full.
apiVersion: kpack.io/v1alpha2
kind: ClusterStack
metadata:
  name: jammy-full
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  id: io.buildpacks.stacks.jammy
  buildImage:
    image: index.docker.io/paketobuildpacks/build-jammy-full:latest
  runImage:
    image: index.docker.io/paketobuildpacks/run-jammy-full:latest
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: paketo-java
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: index.docker.io/paketobuildpacks/java:latest
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: paketo-nodejs
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: index.docker.io/paketobuildpacks/nodejs:latest
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: paketo-go
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: index.docker.io/paketobuildpacks/go:latest
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: paketo-python
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: index.docker.io/paketobuildpacks/python:latest
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: paketo-ruby
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: index.docker.io/paketobuildpacks/ruby:latest
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: paketo-dotnet-core
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: index.docker.io/paketobuildpacks/dotnet-core:latest
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: paketo-web-servers
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: index.docker.io/paketobuildpacks/web-servers:latest
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: paketo-php
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: index.docker.io/paketobuildpacks/php:latest
---
# Heroku's .deb packages buildpack (RFC-0065): an Aptfile in the source
# installs system packages; composed in front of the language by the
# controller, never part of the platform builder's detection.
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: heroku-deb-packages
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: index.docker.io/heroku/buildpack-deb-packages:1.0.1
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: paketo-procfile
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: index.docker.io/paketobuildpacks/procfile:latest
---
# The project's variables for its build (shpyrd #54, buildpacks/build-env):
# first in every group, it gives the buildpacks after it the variables of
# the Secret the controller binds to each build. Published by
# .github/workflows/buildpacks.yml.
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: shpyrd-build-env
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: ghcr.io/shpyrd-io/buildpack-build-env:0.1.0
---
# A package of a JavaScript workspace (shpyrd #145) builds with Node alone
# from Paketo, then shpyrd's workspace buildpack, in a builder of the
# project's own (internal/controller/builder.go).
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: paketo-node-engine
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: index.docker.io/paketobuildpacks/node-engine:latest
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuildpack
metadata:
  name: shpyrd-node-workspace
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  image: ghcr.io/shpyrd-io/buildpack-node-workspace:0.1.0
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuilder
metadata:
  name: shpyrd
  labels:
    app.kubernetes.io/part-of: shpyrd
spec:
  tag: ${SHPYRD_REGISTRY_HOST}/shpyrd/builder
  stack:
    name: jammy
    kind: ClusterStack
  serviceAccountRef:
    name: kpack-builder
    namespace: ${SHPYRD_SYSTEM_NS}
  # Detection runs group by group; the first group whose buildpacks all
  # detect wins. Order mirrors the Paketo base builder, each group behind
  # shpyrd-build-env, which always detects.
  order:
    - group:
        - name: shpyrd-build-env
          kind: ClusterBuildpack
        - name: paketo-java
          kind: ClusterBuildpack
    - group:
        - name: shpyrd-build-env
          kind: ClusterBuildpack
        - name: paketo-nodejs
          kind: ClusterBuildpack
    - group:
        - name: shpyrd-build-env
          kind: ClusterBuildpack
        - name: paketo-go
          kind: ClusterBuildpack
    - group:
        - name: shpyrd-build-env
          kind: ClusterBuildpack
        - name: paketo-python
          kind: ClusterBuildpack
    - group:
        - name: shpyrd-build-env
          kind: ClusterBuildpack
        - name: paketo-ruby
          kind: ClusterBuildpack
    - group:
        - name: shpyrd-build-env
          kind: ClusterBuildpack
        - name: paketo-php
          kind: ClusterBuildpack
    - group:
        - name: shpyrd-build-env
          kind: ClusterBuildpack
        - name: paketo-dotnet-core
          kind: ClusterBuildpack
    - group:
        - name: shpyrd-build-env
          kind: ClusterBuildpack
        - name: paketo-web-servers
          kind: ClusterBuildpack
    - group:
        - name: shpyrd-build-env
          kind: ClusterBuildpack
        - name: paketo-procfile
          kind: ClusterBuildpack
