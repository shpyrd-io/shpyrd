---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shpyrd-local-provisioner
  namespace: shpyrd-local-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shpyrd-local-provisioner
  template:
    metadata:
      labels:
        app: shpyrd-local-provisioner
    spec:
      serviceAccountName: shpyrd-local-provisioner-service-account
