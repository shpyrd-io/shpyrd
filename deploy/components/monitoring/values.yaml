# kube-prometheus-stack values shared by all profiles.
fullnameOverride: monitoring
cleanPrometheusOperatorObjectNames: true

# CRDs come from the monitoring-crds component.
crds:
  enabled: false

alertmanager:
  enabled: false

# Alerts on the platform's own jobs. There is no Alertmanager: they show as
# firing in Prometheus (Alerts) and Grafana (Alerting > Alert rules) and the
# operator console reads them from there. Every annotation says what
# happened and what to do in words (#52): no command, tool or object name.
additionalPrometheusRulesMap:
  shpyrd-platform-backup:
    groups:
      - name: shpyrd-platform-backup
        rules:
          # A run of the platform backup (RFC-0037) ended in failure. The
          # job's runs are joined to their owner, so a manual run from the
          # console counts too. The run stays listed for a day, so this
          # resolves within a day of the failure or when the run is removed.
          - alert: PlatformBackupFailed
            expr: |
              max by (namespace, job_name) (kube_job_status_failed{namespace="shpyrd-system"}) > 0
              and on (namespace, job_name)
              kube_job_owner{namespace="shpyrd-system", owner_kind="CronJob", owner_name="platform-backup"}
            for: 5m
            labels:
              severity: critical
              shpyrd_component: platform-backup
            annotations:
              summary: A platform backup run failed
              description: >-
                A platform backup run ended without writing an archive. The
                Backups page of the operator console lists the recent runs with
                their error; fix the cause and start a backup from there. A run
                that ran out of memory needs a higher memory limit for the
                backup job.
          # No archive younger than 26 hours: a daily schedule missed a run,
          # or every run failed. A backup never completed since the job was
          # set up more than 26 hours ago counts as stale as well.
          - alert: PlatformBackupStale
            expr: |
              (
                time() - kube_cronjob_status_last_successful_time{namespace="shpyrd-system", cronjob="platform-backup"} > 26 * 3600
              )
              or
              (
                (time() - kube_cronjob_created{namespace="shpyrd-system", cronjob="platform-backup"} > 26 * 3600)
                unless on (namespace, cronjob)
                kube_cronjob_status_last_successful_time{namespace="shpyrd-system", cronjob="platform-backup"}
              )
            for: 15m
            labels:
              severity: critical
              shpyrd_component: platform-backup
            annotations:
              summary: No platform backup for more than a day
              description: >-
                The last platform backup that completed is more than 26 hours
                old, or none has completed yet. The Backups page of the operator
                console shows the schedule and the recent runs; start a backup
                from there and check that it completes.
  # Storage and databases (RFC-0060, the storage plan): what an operator
  # must act on when a disk, a database or a node is not where it should be.
  shpyrd-storage:
    groups:
      - name: shpyrd-storage
        rules:
          # The database's WAL archive is what makes its backups recoverable
          # to a point in time. A quiet database still archives a segment
          # every few minutes, so none for 30 minutes means archiving broke.
          - alert: DatabaseWALArchiveStale
            expr: |
              cnpg_pg_stat_archiver_seconds_since_last_archival > 1800
            for: 10m
            labels:
              severity: critical
              shpyrd_component: postgres
            annotations:
              summary: A database has not archived WAL for 30 minutes
              description: >-
                The database {{ $labels.namespace }}/{{ $labels.cluster }} has
                not written to its WAL archive for more than 30 minutes, so its
                backups cannot restore past the last archived segment. The
                database's page in the console shows the archive's last error;
                the object storage behind it is the usual cause.
          # The last archive attempt failed and nothing succeeded since.
          - alert: DatabaseWALArchiveFailing
            expr: |
              cnpg_pg_stat_archiver_seconds_since_last_failure < cnpg_pg_stat_archiver_seconds_since_last_archival
            for: 15m
            labels:
              severity: warning
              shpyrd_component: postgres
            annotations:
              summary: A database's WAL archiving is failing
              description: >-
                The last WAL archive attempt of {{ $labels.namespace }}/{{ $labels.cluster }}
                failed and none has succeeded since. Point-in-time recovery
                stops at the last archived segment until it recovers.
          # An instance of a database is not ready: restarting, waiting for
          # its disk to attach on another node, or refused by a quota.
          - alert: DatabaseInstanceNotReady
            expr: |
              max by (namespace, pod) (kube_pod_status_ready{condition="true"} == 0)
              and on (namespace, pod)
              kube_pod_labels{label_cnpg_io_cluster!=""}
            for: 5m
            labels:
              severity: critical
              shpyrd_component: postgres
            annotations:
              summary: A database instance has not been ready for 5 minutes
              description: >-
                The database instance {{ $labels.namespace }}/{{ $labels.pod }}
                is not ready. Its disk may be attaching to another node after a
                drain (a few minutes after a node loss), or its pod was refused.
                The database's page in the console shows the instance's state.
          # A pod stuck creating for 5 minutes: most often a disk that cannot
          # be attached or mounted (still attached elsewhere, or missing).
          - alert: PodStuckCreating
            expr: |
              max by (namespace, pod) (kube_pod_container_status_waiting_reason{reason="ContainerCreating"} == 1)
            for: 5m
            labels:
              severity: warning
              shpyrd_component: volumes
            annotations:
              summary: A pod has been creating for 5 minutes
              description: >-
                {{ $labels.namespace }}/{{ $labels.pod }} has been starting for
                more than 5 minutes. A disk that cannot be attached or mounted is
                the usual cause: the pod's events say which one and why.
          # A released disk is one a migration or a deletion left behind,
          # kept for a way back. Three days is the agreed keep.
          - alert: RetainedDiskOlderThanThreeDays
            expr: |
              kube_persistentvolume_status_phase{phase="Released"} == 1
            for: 72h
            labels:
              severity: warning
              shpyrd_component: volumes
            annotations:
              summary: A retained disk is more than three days old
              description: >-
                The disk {{ $labels.persistentvolume }} was released more than
                three days ago and is still kept. If the migration or deletion
                it came from is verified, release it; it costs money while it
                exists.
          # A provider disk nobody claims still bills by the hour.
          - alert: UnclaimedBlockDisk
            expr: |
              kube_persistentvolume_status_phase{phase="Available"} == 1
              and on (persistentvolume)
              kube_persistentvolume_info{storageclass!="shpyrd-local", storageclass!=""}
            for: 1h
            labels:
              severity: warning
              shpyrd_component: volumes
            annotations:
              summary: A block disk has been unclaimed for an hour
              description: >-
                The disk {{ $labels.persistentvolume }} exists at the provider
                but nothing claims it. Bind it to what it was made for, or
                delete it.
          # A virtual machine attaches a bounded number of block volumes (32
          # on Oracle Cloud); a node past 24 needs a neighbour.
          - alert: NodeBlockVolumeAttachmentsHigh
            expr: |
              count by (node) (kube_volumeattachment_info) > 24
            for: 15m
            labels:
              severity: warning
              shpyrd_component: volumes
            annotations:
              summary: A node has more than 24 block volumes attached
              description: >-
                The node {{ $labels.node }} has more than 24 block volumes
                attached; the machine stops accepting them at 32. Add a node to
                its pool before that happens.
          # No disk snapshot round completed for 26 hours where the platform
          # takes them nightly: the fallback for every disk is stale.
          - alert: DiskSnapshotsStale
            expr: |
              (
                time() - kube_cronjob_status_last_successful_time{namespace="shpyrd-system", cronjob="platform-snapshots"} > 26 * 3600
              )
              or
              (
                (time() - kube_cronjob_created{namespace="shpyrd-system", cronjob="platform-snapshots"} > 26 * 3600)
                unless on (namespace, cronjob)
                kube_cronjob_status_last_successful_time{namespace="shpyrd-system", cronjob="platform-snapshots"}
              )
            for: 15m
            labels:
              severity: warning
              shpyrd_component: volumes
            annotations:
              summary: No disk snapshots for more than a day
              description: >-
                The nightly round of disk snapshots has not completed for more
                than 26 hours, or never has. The snapshots are the way back for
                every block disk; the job's last run says which disk failed.
          # A node started with the registry-trust taint and kept it: the
          # trust was never written, so project pods cannot land there.
          - alert: NodeRegistryTrustPending
            expr: |
              kube_node_spec_taint{key="shpyrd.io/registry-trust"} == 1
            for: 5m
            labels:
              severity: warning
              shpyrd_component: registry
            annotations:
              summary: A node has waited more than 5 minutes for registry trust
              description: >-
                The node {{ $labels.node }} still carries the taint that keeps
                project pods away until it trusts the in-cluster registry. The
                registry trust pod on that node did not finish; its logs say
                why.

prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

prometheus:
  prometheusSpec:
    # Discover ServiceMonitors/PodMonitors/Rules from every namespace, not
    # only the ones carrying the Helm release label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # Where the data lives is decided by SHPYRD_MONITORING_SIZE (pkg/install):
    # a persistent claim of that size with the class of SHPYRD_STORAGE_CLASS,
    # or the chart's emptyDir when it is empty (the local profile). The
    # retention must fit the claim; the cloud profiles set both.
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  grafana.ini:
    server:
      root_url: https://grafana.${SHPYRD_DOMAIN}
    security:
      # Panels are embedded in the shpyrd dashboard.
      allow_embedding: true
    analytics:
      check_for_updates: false
      reporting_enabled: false
  ingress:
    enabled: true
    ingressClassName: ${SHPYRD_PLATFORM_INGRESS_CLASS}
    annotations:
      cert-manager.io/cluster-issuer: ${SHPYRD_PLATFORM_ISSUER}
    hosts:
      - grafana.${SHPYRD_DOMAIN}
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.${SHPYRD_DOMAIN}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

kube-state-metrics:
  # The chart's default collectors stay: the platform backup alerts above
  # read the jobs and cronjobs collectors (kube_job_status_failed,
  # kube_job_owner, kube_cronjob_status_last_successful_time,
  # kube_cronjob_created), so `collectors` is not redefined here.
  # Expose the shpyrd labels on kube_pod_labels so the dashboard can break
  # CPU and memory down by process type (web, worker...).
  # Labels the metering loop attributes usage by (RFC-0075): process type,
  # database (CNPG), store (Redis), build pod (kpack), volume. KSM exports
  # kube_*_labels only for the resources and labels listed here.
  metricLabelsAllowlist:
    - pods=[shpyrd.io/app,shpyrd.io/process,shpyrd.io/redis,cnpg.io/cluster,kpack.io/build]
    - persistentvolumeclaims=[shpyrd.io/app,shpyrd.io/volume,shpyrd.io/redis,cnpg.io/cluster]
    - namespaces=[shpyrd.io/workspace,shpyrd.io/project,shpyrd.io/workspace-id,shpyrd.io/project-id]
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheus-node-exporter:
  prometheus:
    monitor:
      # Stamp every node-exporter series with the Kubernetes node name. The
      # kernel hostname (nodename) is not the node name on cloud providers
      # (OKE nodes are named by IP, the machine by its instance name), and the
      # dashboard joins machine utilisation with kube-state-metrics by node.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          action: replace
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
