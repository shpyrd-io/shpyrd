name: monitoring
description: Prometheus, Grafana, node-exporter and kube-state-metrics (kube-prometheus-stack)
namespace: monitoring
helm:
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  version: 91.4.1
  release: monitoring
  values: [values.yaml]
  # CRDs are installed by the monitoring-crds component in rc0.
  skipCRDs: true
# Prometheus keeps its data on a claim of SHPYRD_MONITORING_SIZE (none when
# empty), pinned to the platform pool with the rest of the stack. Changing
# the size of an existing claim follows the storage class's expansion rules:
# the claim grows in place when the class allows it, otherwise it keeps its
# size until it is recreated.
kustomize:
  path: base
wait:
  - deployment: monitoring/monitoring-operator
  - deployment: monitoring/monitoring-grafana
  - deployment: monitoring/monitoring-kube-state-metrics
  - statefulSet: monitoring/prometheus-monitoring
timeout: 15m
