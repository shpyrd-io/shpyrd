apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-gateway
  namespace: ${SHPYRD_SYSTEM_NS}
  labels:
    app.kubernetes.io/name: pg-gateway
    app.kubernetes.io/managed-by: shpyrd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pg-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-gateway
    spec:
      serviceAccountName: pg-gateway
      containers:
        - name: pg-gateway
          image: "${SHPYRD_SERVER_IMAGE}"   # the server image ships /pg-gateway
          imagePullPolicy: IfNotPresent
          command: [/pg-gateway]
          env:
            - name: SHPYRD_SYSTEM_NAMESPACE
              value: "${SHPYRD_SYSTEM_NS}"
          ports:
            - containerPort: 15000
              name: wake-start
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
