apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-gateway
  namespace: shpyrd-system
  labels:
    app.kubernetes.io/name: pg-gateway
    app.kubernetes.io/managed-by: shpyrd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pg-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-gateway
    spec:
      serviceAccountName: shpyrd-server   # reuse: reads Postgres CRDs
      containers:
        - name: pg-gateway
          image: SHPYRD_SERVER_IMAGE       # replaced by cluster init; same image as the server
          args: [/pg-gateway]
          env:
            - name: SHPYRD_SYSTEM_NAMESPACE
              value: shpyrd-system
          ports:
            - containerPort: 15000
              name: wake-start
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
