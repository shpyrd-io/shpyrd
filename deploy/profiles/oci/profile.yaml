name: oci
description: Oracle Cloud (OKE) with a public load balancer, Let's Encrypt certificates and the in-cluster registry
vars:
  # Project disks and databases are provider block volumes (SHPYRD_STORAGE_CLASS
  # below, with its minimum size and its snapshots): they follow their process
  # or database to another node, so a node can be drained or lost without
  # losing data. Claims that exist keep their class; shpyrd-local (the node's
  # disk) stays installed for them until the last one is migrated.
  SHPYRD_PROJECT_STORAGE_CLASS: ""
  SHPYRD_DATABASE_STORAGE_CLASS: ""
  # Pass --domain (a wildcard DNS record you own) and the address
  # (contrib/oci/terraform creates the cluster and prints them):
  #   --set SHPYRD_ACME_EMAIL=you@example.com --set SHPYRD_LB_IP=<reserved address>
  # A provider registry instead of the in-cluster one (RFC-0059):
  #   --registry-host <region-key>.ocir.io/<tenancy-namespace>
  #   --registry-user <tenancy-namespace>/<user> --registry-token-file ~/.oci/ocir-token
  SHPYRD_DOMAIN: apps.example.com
  # In-cluster registry on a fixed ClusterIP in the cluster's Service range
  # (10.96.0.0/16 in contrib/oci/terraform), TLS from the platform CA.
  SHPYRD_REGISTRY_IP: 10.96.0.50
  SHPYRD_REGISTRY_HOST: 10.96.0.50:5000
  SHPYRD_REGISTRY_INSECURE: "false"
  SHPYRD_REGISTRY_SECRET: shpyrd-registry
  SHPYRD_REGISTRY_SIZE: 50Gi        # OCI block volumes start at 50 GB
  SHPYRD_REGISTRY_GC: "0 4 * * 0"    # weekly garbage collection (cron, UTC; "off" disables)
  # Public certificates from Let's Encrypt; the platform CA (generated once
  # in the cluster) signs the registry and the admission webhook.
  SHPYRD_CLUSTER_ISSUER: letsencrypt
  SHPYRD_ACME_EMAIL: ""
  SHPYRD_CA_SOURCE: cluster
  # OKE with VCN-native pod networking enforces no NetworkPolicy on its own;
  # project isolation needs Calico in policy-only mode (Oracle's supported
  # path). "none" when the cluster already runs a policy engine.
  SHPYRD_NETWORK_POLICY: calico
  # DNS automation (RFC-0061): `--dns oci` with the compartment, tenancy,
  # region and either the DNS user's API key (--dns-user, --dns-key-file) or
  # --dns-auth workload on an enhanced cluster. Records for the platform's
  # hostnames are then published by ExternalDNS and one wildcard certificate
  # (DNS-01) serves every project.
  # Front doors (RFC-0036): external LB for the platform (default; move to
  # internal when you have a VPN). Pass --internal-lb-subnet <ocid> to
  # create the private controller; SHPYRD_INTERNAL_LB=false skips it.
  # Console name (RFC-0078): the subdomain of SHPYRD_DOMAIN the dashboard
  # answers at. Default "shpyrd" → shpyrd.<domain>. Set to "apex" for the
  # production layout where the console is at the domain itself
  # (e.g. operator.shpyrd.io with SHPYRD_DOMAIN=operator.shpyrd.io).
  SHPYRD_CONSOLE_NAME: shpyrd
  # Auth URL: the Dex OIDC issuer (RFC-0014). Defaults to auth.<domain>.
  # On production set this explicitly to auth.shpyrd.io (a manual A record
  # outside the delegated zone) so SSO connector callbacks are stable.
  SHPYRD_AUTH_URL: ""
  SHPYRD_PLATFORM_EXPOSURE: external
  SHPYRD_INTERNAL_LB: "auto"
  SHPYRD_INTERNAL_LB_SUBNET: ""
  SHPYRD_INGRESS_CLASS_EXTERNAL: nginx
  SHPYRD_INGRESS_CLASS_INTERNAL: nginx-internal
  # Volumes (RFC-0060): OCI Block Volume (balanced performance, expansion
  # allowed), which starts at 50 GB; snapshots are block volume backups.
  # Shared volumes are File Storage file systems behind the mount target
  # contrib/oci/terraform creates (shared_storage = true; its outputs give
  # both values): --set SHPYRD_FSS_MOUNT_TARGET=<ocid> --set SHPYRD_FSS_AD=<ad>
  SHPYRD_STORAGE_CLASS: oci-bv
  SHPYRD_STORAGE_CLASS_SHARED: shpyrd-fss
  SHPYRD_VOLUME_MIN_SIZE: 50Gi
  # Object storage (RFC-0046): the MinIO volume of the object-storage extension.
  # The control-plane database (RFC-0033): PostgreSQL in the cluster unless
  # SHPYRD_DATABASE_URL names a managed one.
  SHPYRD_DATABASE_URL: ""
  SHPYRD_CONTROL_PLANE_DB_SIZE: 50Gi
  SHPYRD_OBJECT_STORAGE_SIZE: 50Gi
  # The S3 gateway (RFC-0046) on OCI: Object Storage's S3 compatibility
  # honours If-None-Match but ignores If-Match, so the gateway runs as the
  # single writer of its descriptors, in one pod, until they move to a store
  # with conditional updates.
  SHPYRD_GATEWAY_SINGLE_WRITER: "true"
  SHPYRD_GATEWAY_REPLICAS: "1"
  # Prometheus keeps 15 days of metrics (the sleep activity signal and the
  # usage history read from it) on a block volume; OCI block volumes start
  # at 50 GB. Growing an existing claim follows the class's expansion rules.
  SHPYRD_MONITORING_SIZE: 50Gi
  # Platform backups (RFC-0037): nightly encrypted archives of the platform's
  # state to the provider's object storage (contrib/*/terraform prints the
  # target); empty means none.
  SHPYRD_BACKUP_TARGET: ""
  SHPYRD_BACKUP_ENDPOINT: ""
  SHPYRD_BACKUP_REGION: ""
  SHPYRD_BACKUP_SCHEDULE: "0 3 * * *"
  SHPYRD_BACKUP_KEEP: "14"
  # Memory limit of the backup job; raise it when the archives (every
  # app's source) outgrow it and the run dies at its limit.
  SHPYRD_BACKUP_MEMORY: 1Gi
  SHPYRD_SNAPSHOT_CLASS: oci-bv-backup
  SHPYRD_FSS_MOUNT_TARGET: ""
  SHPYRD_EFS_ID: ""
  SHPYRD_AWS_CLUSTER: ""
  SHPYRD_AWS_REGION: ""
  SHPYRD_AWS_VPC_ID: ""
  SHPYRD_AWS_LB_EIPS: ""
  SHPYRD_FSS_AD: ""
  SHPYRD_DNS_PROVIDER: none
  SHPYRD_DNS_AUTH: key
  SHPYRD_DNS_ZONE_ID: ""
  SHPYRD_DNS_COMPARTMENT: ""
  SHPYRD_DNS_TENANCY: ""
  SHPYRD_DNS_REGION: ""
  SHPYRD_DNS_USER: ""
  # A cloud load balancer terminates nothing and listens on 80/443: URLs carry no port.
  SHPYRD_FRONT_DOOR: lb
  # Reserved public address for the load balancer (contrib/oci/terraform output
  # load_balancer_ip); empty lets OCI pick an ephemeral one.
  SHPYRD_LB_IP: ""
  # Node pools (RFC-0077): the shpyrd.io/pool label values. The installer
  # puts every pod of the platform on the platform pool, and the
  # projects' databases, stores and object storage on the data pool (the
  # platform pool when there is none); the controller puts processes and
  # builds on the apps pool. contrib/oci/terraform labels the pools and
  # writes the values in the vars file; init refuses a platform pool with
  # no node. CoreDNS is OKE's and stays where OKE puts it.
  SHPYRD_PLATFORM_POOL: platform
  SHPYRD_APPS_POOL: ""
  SHPYRD_DATA_POOL: ""
  # The Kubernetes `cluster export` renders the charts for: the version
  # contrib/oci/terraform creates. cluster init uses the cluster's own.
  SHPYRD_KUBE_VERSION: v1.36.1
  # Cluster autoscaler (RFC-0075): pass the node pool OCID and bounds from
  # Terraform output (contrib/oci/terraform output node_pool_id).
  # Empty SHPYRD_NODE_POOL_ID disables the component.
  SHPYRD_NODE_POOL_ID: ""
  SHPYRD_NODE_MIN_COUNT: "1"
  SHPYRD_NODE_MAX_COUNT: "5"
  # kpack build cache stored in the registry instead of a 50 Gi block disk
  # per app (RFC-0075). Set to the registry host when SHPYRD_REGISTRY_BUCKET
  # is configured; empty keeps the old PVC behaviour.
  SHPYRD_BUILD_CACHE_REGISTRY: ""
  SHPYRD_LOCAL_DNS: "false"
  SHPYRD_HTTP_PORT: "80"
  SHPYRD_HTTPS_PORT: "443"
  # OKE VCN-native pod networking: pods get addresses from the pod subnet;
  # with the flannel CNI use 10.244.0.0/16.
  SHPYRD_POD_CIDR: 10.0.4.0/22  # The applications the server serves come from this image (RFC-0080):
  # the server's own unless an image holding only the applications is set.
  SHPYRD_UI_IMAGE: ""
runlevels:
  - name: rc0
    components: [monitoring-crds]
  - name: rc1
    components: [storage-local, object-gateway, network-policy, cert-manager, registry-credentials, platform-service, snapshot-controller, storage-fss]
  - name: rc2
    components: [letsencrypt-issuers, ca-issuers, trust-manager, ingress-nginx, ingress-nginx-internal, registry, registry-nodes, external-dns, dns01-oci]
  - name: rc3
    components: [kpack, monitoring, dns, control-plane-db, cluster-autoscaler]
  - name: rc4
    components: [shpyrd, platform-backup]
