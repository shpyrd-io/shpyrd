# OCI profile overlay for the pg-gateway component: it runs the server image
# (OCIR), so it needs the same pull secret as the server. On the
# ServiceAccount as well as the Deployment, for the same reason as in
# ../shpyrd: every pod under this identity is covered.
resources:
  - ../../../components/pg-gateway

patches:
  - target:
      kind: ServiceAccount
      name: pg-gateway
    patch: |
      - op: add
        path: /imagePullSecrets
        value:
          - name: ocir-pull
  - target:
      kind: Deployment
      name: pg-gateway
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ocir-pull
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
