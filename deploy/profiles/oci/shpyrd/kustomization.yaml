# OCI profile overlay for the shpyrd component: adds the OCIR pull secret
# so the cloud server image (gru.ocir.io/…) can be pulled by the nodes.
resources:
  - ../../../components/shpyrd/base

patches:
  - target:
      kind: Deployment
      name: shpyrd-server
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ocir-pull
      # The cloud image is rebuilt under the same tag while a release is
      # being prepared; always ask the registry.
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
