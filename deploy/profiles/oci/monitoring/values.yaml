# OKE: the control plane is managed, so its components cannot be scraped.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # On a 50 GB block volume (SHPYRD_MONITORING_SIZE); the series the
    # platform keeps are small and two weeks of them fit with room to spare.
    retention: 15d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi

# Grafana is the operators' tool: shpyrd's own charts read Prometheus, not
# Grafana. Reachable only through the internal front door (the VPN), with
# no anonymous access and the chart's generated admin password (kept across
# upgrades in the monitoring-grafana Secret; read it with kubectl).
grafana:
  ingress:
    ingressClassName: ${SHPYRD_INGRESS_CLASS_INTERNAL}
