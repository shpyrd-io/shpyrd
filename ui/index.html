<!doctype html>
<!-- Development only: the Vite dev server serves the two applications at
     /apps/console/ and /apps/workspace/ (RFC-0080). The shpyrd server picks
     one by host and never serves this file. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shpyrd (dev)</title>
    <script>
      fetch("/api/config")
        .then((r) => r.json())
        .then((c) => {
          location.replace(c.door === "console" ? "/apps/console/" : "/apps/workspace/");
        })
        .catch(() => location.replace("/apps/workspace/"));
    </script>
  </head>
  <body></body>
</html>
