# Releases @shpyrd/ui in one run when the version in design/ui/package.json
# is one npm does not have (design/ui/README.md, "Releasing"): its gates,
# then the package packed once, its commit tagged ui-v<version>, a GitHub
# release with the version's CHANGELOG section and that tarball, and the
# same tarball *staged* on npm with provenance. Nobody can install it until
# a maintainer approves it on npm with 2FA; the run's summary says how. A
# push that changes no version releases nothing.
#
# Two jobs, so that no dependency's code runs where publishing is possible:
# the gates install the dependencies (and run their install scripts) with a
# token that can only read; the publishing job installs nothing but a pinned
# npm, packs the tarball itself (the package needs nothing installed to
# pack), keeps no credentials in its checkout, and is the only one that may
# ask for an OIDC token or write the repository.
#
# npm trusts this workflow (trusted publishing, OIDC; set on the package's
# npm settings: repository shpyrd-io/shpyrd, workflow ui-release.yml, no
# environment), for staging only: "Allow npm publish" stays unchecked, so
# the workflow alone can never put a version in front of users. No token
# is stored.
name: ui-release

on:
  push:
    branches: [main]
    paths: ["design/ui/**", ".github/workflows/ui-release.yml"]

permissions:
  contents: read

# One release at a time: a push delivered twice must not publish twice.
concurrency:
  group: ui-release
  cancel-in-progress: false

jobs:
  gates:
    name: "@shpyrd/ui: what to release, and its gates"
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: What to release
        id: plan
        working-directory: design/ui
        run: node scripts/release-plan.mjs
      - name: The library's gates
        if: steps.plan.outputs.publish == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run lint --workspace design/ui
          npm run typecheck --workspace design/ui
          npm run test --workspace design/ui
          (cd design/ui && node scripts/check-pack.mjs)

  publish:
    name: "@shpyrd/ui to npm"
    needs: gates
    if: needs.gates.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the ui-v tag and its GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: What to release
        id: plan
        working-directory: design/ui
        run: node scripts/release-plan.mjs
      # Packed once, here, from this commit: the file the GitHub release
      # carries is the file npm stages.
      - name: Pack
        id: pack
        if: steps.plan.outputs.publish == 'true'
        working-directory: design/ui
        run: |
          npm install --global npm@11.21.0 # has npm stage; trusted publishing needs 11.5.1 or later
          node scripts/check-pack.mjs
          mkdir -p "$RUNNER_TEMP/pack"
          file=$(npm pack --pack-destination "$RUNNER_TEMP/pack" --json | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')
          echo "tarball=$RUNNER_TEMP/pack/$file" >> "$GITHUB_OUTPUT"
      # The tag marks what npm gets: this run's own commit, which GitHub
      # always lets this workflow tag. Accepted again when it is already
      # there on this commit, so a re-run goes on.
      - name: Tag the commit npm gets
        if: steps.plan.outputs.publish == 'true'
        env:
          TAG: ${{ steps.plan.outputs.git_tag }}
        run: |
          at=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)
          if [ -z "$at" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          elif [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error title=$TAG is on another commit::$TAG points at $at, not at this run's $GITHUB_SHA. If that version was rejected on npm, delete its GitHub release and tag (gh release delete $TAG --cleanup-tag) and run again."
            exit 1
          fi
      # Never the repository's latest release: that is the CLI's, which the
      # install script follows. Made only when missing, so a re-run goes on.
      - name: GitHub release
        if: steps.plan.outputs.publish == 'true'
        env:
          TAG: ${{ steps.plan.outputs.git_tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          NOTES: ${{ steps.plan.outputs.notes_file }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          PRERELEASE: ${{ steps.plan.outputs.dist_tag == 'next' && '--prerelease' || '' }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
          gh release create "$TAG" "$TARBALL" --repo "$GITHUB_REPOSITORY" --verify-tag --title "@shpyrd/ui $VERSION" --notes-file "$NOTES" --latest=false $PRERELEASE
      # Last: the one step a re-run cannot repeat. A version already staged
      # and not yet approved fails here: approve or reject it on npm first.
      - name: Stage on npm
        if: steps.plan.outputs.publish == 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.plan.outputs.dist_tag }}
        run: npm stage publish "$TARBALL" --access public --provenance --tag "$DIST_TAG"
      - name: How to approve it
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.git_tag }}
        run: |
          {
            echo "### @shpyrd/ui $VERSION is staged on npm"
            echo
            echo "It is **not installable yet**. Approve it with 2FA:"
            echo
            echo "- npmjs.com → @shpyrd/ui → **Staged Packages** → **Approve**, or"
            echo "- \`npm stage list @shpyrd/ui\`, then \`npm stage approve <id>\`"
            echo
            echo "Rejecting it instead? Also delete its GitHub release and tag: \`gh release delete $TAG --cleanup-tag\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=@shpyrd/ui $VERSION is staged::Approve it on npm; the run's summary says how."
