# The shpyrd.io website (Next.js + Markdoc) lives in website/ and deploys from
# there on Vercel. This job is the pre-merge check; the Vercel preview is the
# visual one.
name: website

on:
  push:
    branches: [main]
    # Repeated under pull_request below: GitHub Actions does not support YAML
    # anchors, so the two lists have to be kept in sync by hand.
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        # Load-bearing: next, the Markdoc loader and src/markdoc/search.mjs
        # all resolve config and content relative to the process working
        # directory, so a build from the repository root fails outright.
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
