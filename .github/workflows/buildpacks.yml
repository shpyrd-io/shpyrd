# The platform's own buildpacks (buildpacks/): on a tag
# buildpack-<name>/vX.Y.Z, package buildpacks/<name> and push it to GHCR as
# ghcr.io/shpyrd-io/buildpack-<name>:X.Y.Z, which the kpack component's
# ClusterBuildpack names (deploy/components/kpack/base/builder.yaml). The
# package must be public (once, in the organisation's package settings):
# every cluster pulls it without credentials. Until a version the manifest
# names exists, kpack cannot make the platform's builder and every
# buildpack build fails, the end-to-end CI job's included.
#
#   git tag buildpack-build-env/v0.1.0 && git push origin buildpack-build-env/v0.1.0
#
# A buildpack of shell scripts runs on any architecture, so one image serves
# amd64 and arm64 nodes alike.
name: buildpacks

on:
  push:
    tags: ["buildpack-*/v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name and version from the tag
        id: tag
        run: |
          ref="${GITHUB_REF_NAME}"            # buildpack-build-env/v0.1.0
          name="${ref%%/*}"; name="${name#buildpack-}"
          version="${ref##*/v}"
          dir="buildpacks/${name}"
          test -f "${dir}/buildpack.toml" || { echo "no buildpack at ${dir}" >&2; exit 1; }
          grep -q "^  version = \"${version}\"" "${dir}/buildpack.toml" || { echo "${dir}/buildpack.toml is not version ${version}" >&2; exit 1; }
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/shpyrd-io/buildpack-${name}:${version}" >> "$GITHUB_OUTPUT"
      - uses: buildpacks/github-actions/setup-pack@v6.1.1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@v0.7
      - name: Package and push
        run: pack buildpack package "${{ steps.tag.outputs.image }}" --path "${{ steps.tag.outputs.dir }}" --publish
      # pack sets no labels: the source label links the package to this
      # repository, so the workflow's own token may publish its next
      # versions.
      - name: Link the package to the repository
        run: |
          crane mutate "${{ steps.tag.outputs.image }}" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.description="shpyrd's build-env buildpack" \
            --tag "${{ steps.tag.outputs.image }}"
