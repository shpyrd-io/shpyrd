# CI (RFC-0045): Go tests and vet (and the foss build, without ee/), the
# applications' tests, build and lint, the
# manifests render test, and an end-to-end run on a kind cluster that
# deploys the sample projects with buildpacks and a Dockerfile.
#
# What changed decides what runs: a pull request or a push that touches only
# the website, the brand, content, RFCs, docs or the Markdown at the root
# (the "changes" job) runs neither the Go tests, the applications nor the
# end-to-end job, which takes about 45 minutes on a cluster it does not need.
# examples/ is at the repository root, not under apps/, so the projects the
# end-to-end job deploys still trigger it.
#
# The workflow itself always runs, and its last job, "CI", always reports:
# it passes when every job that ran passed and the others were skipped. That
# is the one status check main requires (the "main" ruleset). A path filter on
# the trigger would leave a skipped workflow reporting nothing, and a pull
# request waiting forever for a required check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Without a base to compare with (a new branch, a force-push), all of it.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a file moved lists both its paths, so moving code
          # into docs/ cannot skip the jobs that would miss it.
          code=false
          while IFS= read -r f; do
            case "$f" in
              "" | apps/website/* | design/brand/* | content/* | rfcs/* | docs/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$(git diff --no-renames --name-only "$BASE" HEAD)"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  go:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      # The control-plane store's tests run against PostgreSQL too (RFC-0033).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shpyrd
          POSTGRES_PASSWORD: shpyrd
          POSTGRES_DB: shpyrd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shpyrd" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHPYRD_TEST_DATABASE_URL: postgres://shpyrd:shpyrd@127.0.0.1:5432/shpyrd?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1
      # The foss build has none of ee/ (ee/LICENSE): it must keep building,
      # so the core never comes to depend on ee.
      - name: The foss build, without ee/
        run: |
          go vet -tags foss ./...
          go build -tags foss ./...
          ! go list -tags foss -deps ./cmd/... | grep -q '/shpyrd/ee/'
      - name: Committed CRDs and deepcopy are current
        run: |
          make generate
          git diff --exit-code -- api deploy/components/shpyrd/base/crds

  ui:
    name: Applications
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint --workspace design/ui --workspace apps/shared --workspace apps/console --workspace apps/workspace
      - run: npm run typecheck --workspace design/ui --workspace apps/shared --workspace apps/console --workspace apps/workspace
      - run: npm run test --workspace design/ui --workspace apps/shared --workspace apps/console --workspace apps/workspace
      - run: make ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: pkg/ui/dist
          retention-days: 1

  e2e:
    name: End to end on kind
    runs-on: ubuntu-latest
    needs: [go, ui]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: pkg/ui/dist
      - name: Build the CLI and the server image
        run: |
          make cli
          make dev-image SERVER_IMAGE=shpyrd-server:ci
      - name: Create the cluster (everything but the server)
        run: ./bin/shpyrd cluster create --name ci --skip shpyrd --http-port 8080 --https-port 8443
      - name: Install the server built from this commit
        run: |
          make dev-load SERVER_IMAGE=shpyrd-server:ci CLUSTER=ci
          ./bin/shpyrd cluster init --context kind-ci --only shpyrd --set SHPYRD_SERVER_IMAGE=shpyrd-server:ci --http-port 8080 --https-port 8443
          ./bin/shpyrd cluster status --context kind-ci
      - name: Deploy a buildpacks project and a Dockerfile project
        run: |
          set -euo pipefail
          export SHPYRD_CONTEXT=kind-ci
          # hello-world is a public site; api keeps the default: sign-in required (RFC-0033).
          ./bin/shpyrd projects create "Hello World" --public --context kind-ci
          (cd examples/hello && ../../bin/shpyrd deploy --project hello-world --context kind-ci)
          ./bin/shpyrd projects create api --context kind-ci
          (cd examples/api && ../../bin/shpyrd deploy --project api --context kind-ci)
          ./bin/shpyrd projects list --context kind-ci
      - name: The projects answer on their URLs
        run: |
          set -euo pipefail
          TOKEN=$(./bin/shpyrd cluster token --context kind-ci | tail -1)
          for i in $(seq 1 30); do
            if curl -fsk --max-time 5 "https://hello-world.127.0.0.1.nip.io:8443/" >/tmp/hello-world.html; then break; fi
            sleep 5
          done
          head -c 300 /tmp/hello-world.html; echo
          grep -qi "hello world" /tmp/hello-world.html
          # The edge: an anonymous browser is sent to sign in, an anonymous API
          # client gets a JSON 401; the admin token opens it.
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 -H "Accept: text/html" "https://api.127.0.0.1.nip.io:8443/" || true)
            [ "$code" = "302" ] && break
            sleep 5
          done
          echo "anonymous browser: $code"; [ "$code" = "302" ]
          code=$(curl -sk -o /tmp/api-401.json -w '%{http_code}' --max-time 5 "https://api.127.0.0.1.nip.io:8443/" || true)
          echo "anonymous api client: $code"; [ "$code" = "401" ]
          grep -q '"error"' /tmp/api-401.json
          curl -fsk --max-time 10 -H "Authorization: Bearer $TOKEN" "https://api.127.0.0.1.nip.io:8443/" >/tmp/api.html
          head -c 300 /tmp/api.html; echo
          grep -q '"service"' /tmp/api.html
          curl -fsk --max-time 10 "https://shpyrd.127.0.0.1.nip.io:8443/.well-known/jwks.json" >/tmp/jwks.json
          grep -q Ed25519 /tmp/jwks.json
          ./bin/shpyrd access --project api --context kind-ci
          ./bin/shpyrd access set public --project api --context kind-ci
          # The switch is a re-rendered Ingress: nginx keeps redirecting for a few seconds.
          for i in $(seq 1 30); do
            code=$(curl -sk -o /tmp/api-public.html -w '%{http_code}' --max-time 5 "https://api.127.0.0.1.nip.io:8443/" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "public api: $code"; [ "$code" = "200" ]
          grep -q '"service"' /tmp/api-public.html
      - name: Scale, logs, volumes, roles
        run: |
          set -euo pipefail
          ./bin/shpyrd scale web=2 --project hello-world --context kind-ci
          ./bin/shpyrd logs --project hello-world -n 5 --context kind-ci
          ./bin/shpyrd volumes create data --size 1Gi --project api --context kind-ci
          ./bin/shpyrd volumes list --project api --context kind-ci
          ./bin/shpyrd teams create platform --platform-role platform-admin --member ci@example.com --context kind-ci
          ./bin/shpyrd members add hello-world --user dev@example.com --role developer --context kind-ci
          ./bin/shpyrd members add hello-world --team platform --role user --context kind-ci
          ./bin/shpyrd members list hello-world --context kind-ci | grep "dev@example.com" >/dev/null
          ./bin/shpyrd teams list --context kind-ci | grep platform >/dev/null
          # Teams and grants live in the control-plane database and survive a server restart (RFC-0033).
          kubectl --context kind-ci -n shpyrd-system rollout restart deployment/shpyrd-server
          kubectl --context kind-ci -n shpyrd-system rollout status deployment/shpyrd-server --timeout=180s
          ./bin/shpyrd members list hello-world --context kind-ci | grep "dev@example.com" >/dev/null
          ./bin/shpyrd projects destroy api --yes --context kind-ci
      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context kind-ci get pods -A
          kubectl --context kind-ci -n shpyrd-system logs deployment/shpyrd-server --tail=200 || true
          kubectl --context kind-ci get apps.shpyrd.io -A -o yaml || true
          kubectl --context kind-ci get events -A --sort-by=.lastTimestamp | tail -60 || true

  ci:
    name: CI
    needs: [changes, go, ui, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A job ended: $result"; exit 1 ;;
            esac
          done
