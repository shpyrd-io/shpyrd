id: sign-in-with-password

title: Sign in with email and password

area: sign-in

tags: [core]

scenario: established-team

goal: >
  A member of the workspace signs in with their email and password and
  lands on the launcher, which shows the projects they can open.

steps:
  - action: goto
    path: /
    narration: Every workspace has its own front door.

  - action: wait
    text: Sign in to open its applications.

  - action: capture
    name: sign-in
    description: The workspace's sign-in page, with email and password.
    use: { docs: true }

  # One `do` per field, so the filled-in form gets a screenshot.
  - action: do
    instruction: Fill in "owner@acme.test" as the email address, without signing in yet
    narration: Your team signs in with the email they already use.

  - action: do
    instruction: Fill in the password ${env:VOYAGER_PASSWORD}, without signing in yet

  - action: verify
    instruction: The sign-in form shows "owner@acme.test" in its email field and a filled-in password

  - action: capture
    name: sign-in-filled
    description: The sign-in form filled in, before signing in.
    use: { docs: true }

  - action: do
    instruction: Sign in as "owner@acme.test" with password ${env:VOYAGER_PASSWORD}, until the workspace opens signed in as Olivia Owner
    narration: And they land straight on their applications.

  - action: wait
    text: Website

  - action: verify
    instruction: The launcher shows two applications, "Website" and "API", and no sign-in form

  - action: capture
    name: launcher
    description: The launcher of an established workspace, after signing in.
    use: { docs: true, marketing: true }

outputs:
  e2e: true
  screenshots: true
  video: true
  docs: true
  marketing: true
