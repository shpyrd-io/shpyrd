id: tour-run

title: "Tour 3: running a project"

area: projects

tags: [tour]

scenario: tour

goal: >
  What runs and how it is doing: releases and rollbacks, backups, metrics,
  logs, and a shell in a running instance.

steps:
  # Signing in on the launcher, where its result is plain to see.
  - action: goto
    path: /

  - action: wait
    text: Sign in to open its applications.

  - action: do
    instruction: Log in as "owner@acme.test" with password ${env:VOYAGER_PASSWORD}, until the workspace opens signed in as Olivia Owner

  - action: wait
    text: Storefront

  - action: goto
    path: /projects/storefront/releases

  - action: wait
    text: Rollback
    narration: Every change is a release. Any earlier one is a click away.

  - action: capture
    name: releases
    description: Releases, with the one in service and the ones to roll back to.
    use: { docs: true }

  - action: goto
    path: /projects/storefront/backups

  - action: wait
    text: Project backup and restore
    narration: A whole project, code, configuration and data, backs up to one archive.

  - action: capture
    name: backups
    description: Backing up and restoring the whole project.
    use: { docs: true }

  # The button is disabled until the backup status has loaded.
  - action: wait
    selector: "button:has-text('Download project backup'):not([disabled])"

  - action: do
    instruction: Click Download project backup, until its confirmation dialog opens, and confirm nothing in it

  - action: wait
    text: Back up Storefront?

  - action: capture
    name: backup-dialog
    description: The confirmation before backing up a project.
    use: { docs: true }

  - action: goto
    path: /projects/storefront/metrics

  - action: wait
    text: Response time
    narration: "Metrics come with every app: response time, traffic, CPU and memory."

  - action: capture
    name: metrics
    description: Response time, traffic, CPU and memory of a project.
    use: { docs: true }

  - action: goto
    path: /projects/storefront/logs

  - action: wait
    text: Every process
    narration: So do its logs, live, from every instance.

  - action: capture
    name: logs
    description: The logs of every process, live.
    use: { docs: true }

  - action: goto
    path: /projects/storefront/shell

  # The instance chosen once the list has loaded (web.1, web.2...).
  - action: wait
    text: web.

  - action: capture
    name: shell
    description: Opening a shell in a running instance.
    use: { docs: true }

  # Connect is disabled until the instances have loaded.
  - action: wait
    selector: "button:has-text('Connect'):not([disabled])"

  - action: do
    instruction: Click the Connect button beside the instance chooser, to open a shell in the instance

  - action: wait
    text: Disconnect
    narration: And a shell inside it, from the browser.

  - action: capture
    name: shell-connected
    description: A shell inside a running instance.
    use: { docs: true }

outputs:
  e2e: true
  screenshots: true
  video: true
  docs: true
  marketing: false
