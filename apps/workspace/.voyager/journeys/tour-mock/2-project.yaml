id: mock-project

title: "Mock tour 2: a project and its header"

area: projects

tags: [tour, mock]

scenario: mock

goal: >
  A project's overview, and what its header opens: its name and icon,
  deploying from Git, the deploy options, and destroying it (not confirmed).

steps:
  - action: goto
    path: /projects/hello-world

  - action: wait
    text: Summary
    narration: "Each project has a page of its own: what runs, from which source, and what changed last."

  - action: capture
    name: overview
    description: The overview of a running project.
    use: { docs: true, marketing: true }

  - action: do
    instruction: Open the dialog to change the project's name, icon and description

  - action: wait
    text: Name, icon and description

  - action: capture
    name: name-icon-dialog
    description: Changing a project's name, icon and description.
    use: { docs: true }

  - action: goto
    path: /projects/hello-world

  - action: wait
    text: Summary

  - action: capture
    name: overview-before-deploy
    description: The overview, before deploying.
    use: { docs: true }

  - action: do
    instruction: Click Deploy, until the Deploy from Git dialog opens

  - action: wait
    text: Deploy from Git
    narration: Deploy from a Git repository, with buildpacks or a Dockerfile.

  - action: capture
    name: deploy-dialog
    description: Deploying a project from Git.
    use: { docs: true }

  - action: goto
    path: /projects/hello-world

  - action: wait
    text: Summary

  - action: capture
    name: overview-before-options
    description: The overview, before the deploy options.
    use: { docs: true }

  - action: do
    instruction: Click More options beside Deploy, until its menu opens

  - action: wait
    text: Rebuild from the source

  - action: capture
    name: deploy-options
    description: The deploy button's other options.
    use: { docs: true }

  - action: goto
    path: /projects/hello-world

  - action: wait
    text: Summary

  - action: capture
    name: overview-before-destroy
    description: The overview, before destroying.
    use: { docs: true }

  - action: do
    instruction: Click Destroy the project, until its confirmation dialog opens, and confirm nothing in it

  - action: wait
    text: to confirm
    narration: Destroying a project asks for its name first, so it never happens by accident.

  - action: capture
    name: destroy-dialog
    description: The confirmation before destroying a project.
    use: { docs: true }

outputs:
  e2e: true
  screenshots: true
  video: true
  docs: true
  marketing: false
