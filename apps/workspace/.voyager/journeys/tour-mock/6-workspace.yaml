id: mock-workspace

title: "Mock tour 6: the workspace settings"

area: workspace

tags: [tour, mock]

scenario: mock

goal: >
  The workspace's own settings: its name, look and plan, people, teams,
  sign-in methods, API tokens, assistants, MCP, config vars for every project,
  log drains and domains.

steps:
  - action: goto
    path: /workspace

  - action: wait
    text: Name and look
    narration: "The workspace has settings of its own: its name, colour, logo and plan."

  - action: capture
    name: general
    description: The workspace's name, look and plan.
    use: { docs: true }

  - action: goto
    path: /workspace/people

  - action: wait
    text: marcelo@acme.com
    narration: Its people and their roles.

  - action: capture
    name: people
    description: The people of the workspace and their roles.
    use: { docs: true }

  - action: do
    instruction: Click Invite, until the Invite someone dialog opens

  - action: wait
    text: Invite someone

  - action: capture
    name: invite-dialog
    description: Inviting someone to the workspace.
    use: { docs: true }

  - action: goto
    path: /workspace/teams

  - action: wait
    text: finance
    narration: Teams group people, so roles are given once.

  - action: capture
    name: teams
    description: The teams of the workspace.
    use: { docs: true }

  - action: do
    instruction: Click New team, until the New team dialog opens

  - action: wait
    text: Make the team

  - action: capture
    name: team-dialog
    description: Making a team.
    use: { docs: true }

  - action: goto
    path: /workspace/teams

  - action: wait
    text: finance

  - action: capture
    name: teams-again
    description: The teams, again.
    use: { docs: true }

  - action: do
    instruction: Click Edit platform, until the dialog of the team platform opens

  - action: wait
    text: The team platform

  - action: capture
    name: team-edit-dialog
    description: Editing a team.
    use: { docs: true }

  - action: goto
    path: /workspace/sign-in

  - action: wait
    text: Google (acme.com)
    narration: People sign in with your company's provider.

  - action: capture
    name: sign-in-settings
    description: How people sign in, and who may join.
    use: { docs: true }

  - action: do
    instruction: Click Add in the sign-in methods, until the Add a sign-in method dialog opens

  - action: wait
    text: Add a sign-in method

  - action: capture
    name: sign-in-method-dialog
    description: Adding a sign-in method.
    use: { docs: true }

  - action: goto
    path: /workspace/tokens

  - action: wait
    text: ci-deploy

  - action: capture
    name: tokens
    description: API tokens for scripts and CI.
    use: { docs: true }

  - action: do
    instruction: Click New token, until the New token dialog opens

  - action: wait
    text: Lasts
    narration: Tokens for scripts and CI, scoped to a project or the whole workspace.

  - action: capture
    name: token-dialog
    description: Making an API token.
    use: { docs: true }

  - action: goto
    path: /workspace/connections

  - action: wait
    text: GitHub Actions
    narration: AI assistants and pipelines connect as people do, and can be cut off at once.

  - action: capture
    name: connections
    description: The assistants and pipelines connected to the workspace.
    use: { docs: true }

  - action: goto
    path: /workspace/mcp

  - action: wait
    text: Add it to your AI
    narration: Through MCP, an assistant sees and does what you may, nothing more.

  - action: capture
    name: mcp
    description: Connecting an AI assistant through MCP.
    use: { docs: true }

  - action: goto
    path: /workspace/globals

  - action: wait
    text: SENTRY_DSN
    narration: Config vars every project gets at once.

  - action: capture
    name: globals
    description: Config vars every project gets.
    use: { docs: true }

  - action: goto
    path: /workspace/drains

  - action: wait
    text: datadog

  - action: capture
    name: workspace-drains
    description: Log drains for every project of the workspace.
    use: { docs: true }

  - action: do
    instruction: Click Add, until the Add a drain dialog opens

  - action: wait
    text: Add a drain

  - action: capture
    name: workspace-drain-dialog
    description: Adding a log drain for the whole workspace.
    use: { docs: true }

  - action: goto
    path: /workspace/domains

  - action: wait
    text: intranet.acme.com
    narration: And the workspace can answer at a domain of your own.

  - action: capture
    name: workspace-domains
    description: The workspace's own domains.
    use: { docs: true }

outputs:
  e2e: true
  screenshots: true
  video: true
  docs: true
  marketing: false
